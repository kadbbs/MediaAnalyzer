<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MediaAnalyzer</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="workspace">
        <header class="topbar">
          <div>
            <h1>MediaAnalyzer</h1>
            <p>媒体容器与 codec header 分析工作台</p>
          </div>
          <div class="status" id="status">Ready</div>
        </header>

        <section class="input-grid">
          <form class="panel" id="uploadForm">
            <h2>上传文件</h2>
            <input id="fileInput" name="file" type="file">
            <button type="submit">分析文件</button>
          </form>

          <form class="panel" id="urlForm">
            <h2>输入 URL</h2>
            <input id="urlInput" name="url" type="url" placeholder="https://example.com/video.mp4">
            <button type="submit">分析 URL</button>
          </form>
        </section>

        <section class="toolbar" role="tablist" aria-label="分析结果视图">
          <button class="tab active" type="button" data-view="overview">总览</button>
          <button class="tab" type="button" data-view="tracks">轨道与编码</button>
          <button class="tab" type="button" data-view="structure">容器结构</button>
          <button class="tab" type="button" data-view="json">JSON</button>
        </section>

        <section class="view active" id="overviewView">
          <article class="summary-band">
            <div class="metric">
              <span>格式</span>
              <strong id="format">-</strong>
            </div>
            <div class="metric">
              <span>容器</span>
              <strong id="containerFormat">-</strong>
            </div>
            <div class="metric">
              <span>时长</span>
              <strong id="duration">-</strong>
            </div>
            <div class="metric">
              <span>轨道</span>
              <strong id="trackCount">-</strong>
            </div>
            <div class="metric">
              <span>置信度</span>
              <strong id="confidence">-</strong>
            </div>
          </article>

          <section class="two-column">
            <article class="panel">
              <h2>输入</h2>
              <dl class="kv" id="inputDetails"></dl>
            </article>
            <article class="panel">
              <h2>识别依据</h2>
              <ul class="evidence-list" id="evidenceList"></ul>
            </article>
          </section>

          <section class="insight-grid">
            <article class="panel">
              <h2>文件解读</h2>
              <ol class="insight-list" id="beginnerInsights"></ol>
            </article>
            <article class="panel">
              <h2>专家速览</h2>
              <dl class="kv" id="expertFacts"></dl>
            </article>
            <article class="panel">
              <h2>术语速查</h2>
              <div class="glossary-list" id="glossaryList"></div>
            </article>
          </section>

          <article class="panel">
            <h2>轨道概览</h2>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>类型</th>
                    <th>Codec</th>
                    <th>时长</th>
                    <th>尺寸/采样率</th>
                    <th>Samples</th>
                  </tr>
                </thead>
                <tbody id="trackSummaryRows"></tbody>
              </table>
            </div>
          </article>
        </section>

        <section class="view" id="tracksView">
          <div class="track-list" id="trackList"></div>
        </section>

        <section class="view" id="structureView">
          <section class="structure-layout">
            <article class="panel">
              <h2>Box Tree</h2>
              <div class="tree" id="structureTree"></div>
            </article>
            <aside class="panel">
              <h2>节点说明</h2>
              <div class="box-guide" id="boxGuide"></div>
            </aside>
          </section>
        </section>

        <section class="view" id="jsonView">
          <article class="panel">
            <h2>原始 JSON</h2>
            <pre id="jsonOutput">{}</pre>
          </article>
        </section>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
