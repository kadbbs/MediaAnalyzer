<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MediaAnalyzer</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="workspace">
        <header class="topbar">
          <div>
            <h1>MediaAnalyzer</h1>
            <p>媒体容器与 codec header 分析工作台</p>
          </div>
          <div class="status" id="status">Ready</div>
        </header>

        <section class="input-grid">
          <form class="panel" id="uploadForm">
            <h2>上传文件</h2>
            <input id="fileInput" name="file" type="file">
            <button type="submit">分析文件</button>
          </form>

          <form class="panel" id="urlForm">
            <h2>输入 URL</h2>
            <input id="urlInput" name="url" type="url" placeholder="https://example.com/video.mp4">
            <button type="submit">分析 URL</button>
          </form>
        </section>

        <section class="result-layout">
          <article class="summary" id="summary">
            <h2>摘要</h2>
            <dl>
              <div><dt>Format</dt><dd id="format">-</dd></div>
              <div><dt>Family</dt><dd id="family">-</dd></div>
              <div><dt>Confidence</dt><dd id="confidence">-</dd></div>
            </dl>
          </article>

          <article class="json-panel">
            <h2>JSON</h2>
            <pre id="jsonOutput">{}</pre>
          </article>
        </section>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
